<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Google+Sans+Flex:opsz,wght@6..144,1..1000&family=Rubik+Doodle+Shadow&display=swap" rel="stylesheet">
  <title>Three Brothers - Reservations</title>
</head>
  <div>
    <h1 class="header">
      <strong> Three </strong>
      <strong style="color: blue"> Brothers  </strong>
      <strong style="color: red">Bento </strong>
      <strong style="color: purple"> Bistro</strong>
    </h1>
    <h2 class="center">
      <a class="nav" id="home" href = "index.html">Home</a>
      <a class="nav" href = "menu.html"> Menu </a>
      <a class="nav button" href = "reservations.html"> Reservations </a>
    </h2>
  </div>
<div>
  <h1 class="reservation"> Make a Reservation with us!</h1>
  <p class="card"> Please remember that reservations are request only and may change based on the availability. Thank you for understanding and we hope to see you!</p>
</div>


<body style="font-family: Google Sans Flex, sans-serif">
<form action="" method="get" class="card">
  <label for="name"> Name: </label>
  <input type="text" id="name" title="Must be 20 characters or less" placeholder="First and Last Name">

  <label for="email"> Email: </label>
  <input type="email" id="email" required pattern="[a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,}$" value="" placeholder="ex: email@blank.com">

  <label for="date"> Date: </label>
  <input type="date" id="date" required value="date">

  <label for="time"> Time: </label>
  <input type="time" id="time" required value="time">



    <fieldset id="seating">
      <legend> Seating Preference: </legend>
      <label>
      <input class="r1" type="radio" name="seating" value="inside"> Inside
      <input class="r2" type="radio" id=radio name="seating" value="outside"> Outside
      <input class="r3" type="radio" name="seating" value="bar"> Bar
      </label>
    </fieldset>




  <label for="dietary"> Dietary Restrictions </label>

  <textarea id="dietary" rows="4" cols="50"></textarea>

  <label for="opt_in"> Join our newsletter? </label>
  <input type="checkbox" id="opt_in">


  <label for="size"> Party Size </label>
  <select id="size" >
    <option value="1"> 1 </option>
    <option value="2"> 2 </option>
    <option value="3"> 3 </option>
    <option value="4"> 4 </option>
    <option value="5"> 5 </option>
    <option value="6"> 6 </option>
    <option value="7"> 7 </option>
    <option value="8"> 8 </option>
  </select>



  <button class="send"> Submit </button>
  <button class="send"> Reset </button>
</form>

</body>
</html>
