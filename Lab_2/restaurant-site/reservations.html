<div class="container">
    <h1 class="header">
      <strong> Three </strong>
      <strong style="color: blue"> Brothers  </strong>
      <strong style="color: red">Bento </strong>
      <strong style="color: purple"> Bistro</strong>
    </h1>

    <div>
      <h1 class="reservation"> Make a Reservation with us!</h1>
      <p class="card"> Please remember that reservations are request only and may change based on the availability. Thank you for understanding and we hope to see you!</p>
    </div>


    <form action="" method="get" class="card">
      <label for="name"> Name: </label>
      <input type="text" id="name" title="Must be 20 characters or less" placeholder="First and Last Name">

      <label for="email"> Email: </label>
      <input type="email" id="email" required pattern="[a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,}$" value="" placeholder="ex: email@blank.com">

      <label for="date"> Date: </label>
      <input type="date" id="date" required value="date">

      <label for="time"> Time: </label>
      <input type="time" id="time" required value="time">



      <fieldset id="seating">
        <legend> Seating Preference: </legend>
        <label>
          <input class="radio" type="radio"  name="seating" value="inside"> Inside
          <input class="radio" type="radio"  name="seating" value="outside"> Outside
          <input class="radio" type="radio" name="seating" value="bar"> Bar
        </label>
      </fieldset>




      <label for="dietary"> Dietary Restrictions </label>

      <textarea id="dietary" rows="4" cols="50"></textarea>

      <label for="opt_in"> Join our newsletter? </label>
      <input type="checkbox" id="opt_in">


      <label for="size"> Party Size </label>
      <select id="size" >
        <option value="1"> 1 </option>
        <option value="2"> 2 </option>
        <option value="3"> 3 </option>
        <option value="4"> 4 </option>
        <option value="5"> 5 </option>
        <option value="6"> 6 </option>
        <option value="7"> 7 </option>
        <option value="8"> 8 </option>
      </select>



      <button class="send"> Submit </button>
      <button class="send"> Reset </button>
    </form>

</div>


<script src="script.js"></script>
